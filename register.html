<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب — VELOCE</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="page-transition-canvas"></canvas>

<header class="site-header">
  <div class="wrap bar">
    <a href="index.html" data-transition class="logo">VELO<span>CE</span></a>
    <nav class="main-nav">
      <a href="index.html" data-transition>الرئيسية</a>
      <a href="shop.html" data-transition>المتجر</a>
    </nav>
    <div class="header-actions"></div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-form-wrap">
    <form class="auth-form" id="register-form">
      <h1>انضم إلى VELOCE</h1>
      <p class="sub">أنشئ حسابك في أقل من دقيقة وابدأ التسوق.</p>

      <div class="form-msg" id="form-msg"></div>

      <div class="field">
        <label for="full-name">الاسم الكامل</label>
        <input type="text" id="full-name" required placeholder="اسمك">
      </div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" required minlength="6" placeholder="6 أحرف على الأقل">
      </div>

      <button type="submit" class="btn btn-cobalt btn-block" id="register-btn">إنشاء الحساب</button>

      <p class="auth-switch">لديك حساب بالفعل؟ <a href="login.html" data-transition>سجّل الدخول</a></p>
    </form>
  </div>
  <div class="auth-visual">
    <canvas id="auth-canvas"></canvas>
    <div class="caption">
      <h2>انضم لمجتمع VELOCE</h2>
      <p>عروض حصرية، وصول مبكر للإصدارات الجديدة، وتتبع سهل لطلباتك.</p>
    </div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/three-auth.js"></script>
<script>
function showMsg(text, type) {
  const el = document.getElementById("form-msg");
  el.textContent = text;
  el.className = `form-msg show ${type}`;
}

document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("register-btn");
  btn.disabled = true;
  btn.textContent = "جارِ الإنشاء...";

  const fullName = document.getElementById("full-name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: { data: { full_name: fullName } },
  });

  btn.disabled = false;
  btn.textContent = "إنشاء الحساب";

  if (error) {
    showMsg(error.message.includes("already") ? "هذا البريد مسجل بالفعل." : "تعذر إنشاء الحساب. حاول مرة أخرى.", "error");
    return;
  }

  if (data.session) {
    sessionStorage.setItem("veloce_transition_in", "1");
    window.location.href = "index.html";
  } else {
    showMsg("تم إنشاء الحساب! تحقق من بريدك الإلكتروني لتأكيد الحساب قبل الدخول.", "success");
  }
});
</script>
<script src="js/three-transition.js"></script>
</body>
</html>
